[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-assistant"
version = "0.1.0"
description = "VECTOR - an open-source, JARVIS-style AI assistant that automates your laptop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "VECTOR contributors" }]
keywords = ["assistant", "automation", "jarvis", "ai", "voice", "claude", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]
dependencies = [
  "anthropic>=2.3.0",
  "psutil>=5.9",
  "pyperclip>=1.8",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
control = ["pyautogui>=0.9.54"]
all = ["vector-assistant[voice,control]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vector = "vector.cli:main"

[project.urls]
Homepage = "https://github.com/reyhaansj/vector"
Issues = "https://github.com/reyhaansj/vector/issues"

[tool.setuptools.packages.find]
include = ["vector*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
