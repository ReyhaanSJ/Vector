[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-assistant"
version = "0.4.0"
description = "VECTOR - an open-source, JARVIS-style AI assistant that automates your laptop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "VECTOR contributors" }]
keywords = ["assistant", "automation", "jarvis", "ai", "voice", "claude", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]
dependencies = [
  "anthropic>=2.3.0",
  "psutil>=5.9",
  "pyperclip>=1.8",
  "pycaw>=20240316; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "vosk>=0.3.45",
  "faster-whisper>=1.0",
  "pyttsx3>=2.90; sys_platform != 'win32'",
]
control = ["pyautogui>=0.9.54"]
app = ["pystray>=0.19", "Pillow>=10", "pynput>=1.7; sys_platform != 'win32'"]
all = ["vector-assistant[voice,control,app]"]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26"]

[project.scripts]
vector = "vector.cli:main"

[project.gui-scripts]
vector-app = "vector.app:main"

[project.urls]
Homepage = "https://github.com/reyhaansj/vector"
Issues = "https://github.com/reyhaansj/vector/issues"

[tool.setuptools.packages.find]
include = ["vector*"]

[tool.setuptools.package-data]
vector = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
