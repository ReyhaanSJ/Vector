name: Release

# Push a tag like v0.3.0 (matching the version in pyproject.toml) to publish a release.
# Each release gets VECTOR-Setup-<version>.zip, and installed copies offer it as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('vector/__init__.py').read()).group(1))")
          meta=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag code=$code pyproject=$meta"
          test "$tag" = "$code" && test "$tag" = "$meta"
      - name: Build the setup ZIP
        run: |
          mkdir dist
          git archive --format zip --prefix "VECTOR-$GITHUB_REF_NAME/" -o "dist/VECTOR-Setup-${GITHUB_REF_NAME#v}.zip" HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "VECTOR ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
