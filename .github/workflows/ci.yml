name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          # macOS minutes cost 10x on private repos, so test just one version there.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pip install pillow
        if: runner.os != 'Linux'
      - name: Typing reaches the summon bar on a real Mac
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: |
          pip install pyautogui
          for combo in "focus=1" "focus=0"; do
            out=$(python tests/mac_typing_check.py $combo); echo "$out"
            echo "$out" | grep -q "typed='hello'"
          done
      - run: pytest -q -o faulthandler_timeout=90
        timeout-minutes: 10
        env:
          VECTOR_SCREENSHOTS: ${{ github.workspace }}/screenshots
          VECTOR_LIVE_UPDATE_TEST: ${{ runner.os == 'Linux' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && matrix.python == '3.13'
        with:
          name: summon-bar-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Live internet check (search + read a page)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        continue-on-error: true  # search sites sometimes rate-limit cloud machines
        run: pytest -q -s tests/test_screen_web.py -k live
        env:
          VECTOR_LIVE_WEB_TEST: "1"
      - name: The summon bar on a real Mac screen (pictures are printed in the log)
        if: runner.os == 'macOS'
        run: |
          pip install pyautogui
          pytest -s -q -o faulthandler_timeout=90 tests/test_macos.py -k summon_bar_on_a_mac
          pytest -s -q -o faulthandler_timeout=90 tests/test_macos.py -k guide_pages_on_a_mac
        timeout-minutes: 8
        env:
          VECTOR_MAC_UI: "1"
      - run: vector --selftest
        continue-on-error: true  # CI has no AI key, sound or screen; this just shows the report

  # Runs the real Windows installer end to end, then the uninstaller.
  windows-installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ai: [none, ollama]
    env:
      VECTOR_INSTALL_YES: "1"
      VECTOR_INSTALL_AI: ${{ matrix.ai }}
      VECTOR_INSTALL_SKIP_MODEL: "1"
      VECTOR_UNINSTALL_YES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Double-click equivalent of "Install VECTOR.bat"
        shell: cmd
        run: echo.| "Install VECTOR.bat"
      - name: VECTOR runs from the installed copy
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\VECTOR\.venv\Scripts\vector.exe"
          & $exe --version; if ($LASTEXITCODE) { exit 1 }
          & $exe --list-skills | Select-Object -First 4
          cmd /c "$env:LOCALAPPDATA\Microsoft\WindowsApps\vector.cmd" --version; if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\VECTOR.lnk")) { throw "no desktop shortcut" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\VECTOR\.venv\Scripts\vector-app.exe")) { throw "no vector-app" }
          & "$env:LOCALAPPDATA\Programs\VECTOR\.venv\Scripts\python.exe" -c "import ctypes,sys; p=r'$env:LOCALAPPDATA\Programs\VECTOR\.venv\Scripts\vector-app.exe'; n=ctypes.windll.shell32.ExtractIconExW(p,-1,None,None,0); print('icons in vector-app.exe:', n); sys.exit(0 if n > 0 else 1)"
          if ($LASTEXITCODE) { throw "vector-app.exe has no icon" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Startup'))\VECTOR.lnk")) { throw "no login shortcut" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\VECTOR.lnk")) { throw "no Start Menu entry" }
          if (Test-Path "$([Environment]::GetFolderPath('Programs'))\VECTOR") { throw "old Start Menu folder still there" }
          $app = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\VECTOR"
          if ($app.DisplayName -ne "VECTOR" -or -not $app.UninstallString) { throw "not listed in Settings > Apps" }
          "Settings > Apps: $($app.DisplayName) $($app.DisplayVersion)"
          & "$env:LOCALAPPDATA\Programs\VECTOR\.venv\Scripts\python.exe" -c "import pystray, PIL, sounddevice, vosk, faster_whisper; print('app + voice packages OK')"
          if ($LASTEXITCODE) { exit 1 }
          Get-Content "$env:USERPROFILE\.vector\config.toml" | Select-String "^(provider|model) ="
          if ("${{ matrix.ai }}" -eq "ollama") {
            if (-not (Select-String -Path "$env:USERPROFILE\.vector\config.toml" -Pattern '^provider = "ollama"')) { throw "ollama not configured" }
          }
      - name: Update over the top keeps settings
        shell: cmd
        env:
          VECTOR_INSTALL_KEEP_SETTINGS: "1"
          VECTOR_INSTALL_AI: claude
        run: |
          echo.| "Install VECTOR.bat" > second-run.log
          type second-run.log
          findstr /C:"Already installed: uv" second-run.log || exit /b 1
          findstr /C:"Already installed: Python" second-run.log || exit /b 1
          findstr /R /C:"^provider = " "%USERPROFILE%\.vector\config.toml"
          findstr /C:"provider = \"anthropic\"" "%USERPROFILE%\.vector\config.toml" && exit /b 1
          exit /b 0
      - name: Uninstall
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\VECTOR\src\scripts\uninstall-windows.ps1"
          if (Test-Path "$env:LOCALAPPDATA\Programs\VECTOR") { throw "app folder still there" }
          if (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\vector.cmd") { throw "vector command still there" }
          if (Test-Path "$([Environment]::GetFolderPath('Startup'))\VECTOR.lnk") { throw "login shortcut still there" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\VECTOR") { throw "still in Settings > Apps" }
          if (-not (Test-Path "$env:USERPROFILE\.vector\config.toml")) { throw "user data should be kept by default" }

  # Runs the real macOS installer end to end: opens the app, updates it, then uninstalls it.
  macos-installer:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ai: [none, ollama]
    env:
      VECTOR_INSTALL_YES: "1"
      VECTOR_INSTALL_AI: ${{ matrix.ai }}
      VECTOR_INSTALL_SKIP_MODEL: "1"
      VECTOR_UNINSTALL_YES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Double-click equivalent of "Install VECTOR.command"
        run: echo | "./Install VECTOR.command"
      - name: VECTOR is installed like a Mac app
        run: |
          APP="$HOME/Library/Application Support/VECTOR"
          BUNDLE="$HOME/Applications/VECTOR.app"
          "$HOME/.local/bin/vector" --version
          "$HOME/.local/bin/vector" --list-skills | head -n 4
          test -x "$BUNDLE/Contents/MacOS/VECTOR"
          test -s "$BUNDLE/Contents/Resources/VECTOR.icns"
          plutil -lint "$BUNDLE/Contents/Info.plist"
          test "$(defaults read "$BUNDLE/Contents/Info" CFBundleName)" = "VECTOR"
          defaults read "$BUNDLE/Contents/Info" NSMicrophoneUsageDescription
          plutil -lint "$HOME/Library/LaunchAgents/com.vector.assistant.plist"
          grep -q "VECTOR.app" "$HOME/Library/LaunchAgents/com.vector.assistant.plist"
          "$APP/.venv/bin/python" -c "import tkinter; tkinter.Tcl(); import PIL, pyautogui, sounddevice, vosk, faster_whisper; print('Tk', tkinter.TkVersion, '+ app + voice packages OK')"
          if "$APP/.venv/bin/python" -c "import pystray" 2>/dev/null; then echo "pystray isn't needed on a Mac"; exit 1; fi
          grep -E "^(provider|model) =" "$HOME/.vector/config.toml" || true
          if [ "${{ matrix.ai }}" = "ollama" ]; then
            grep -q '^provider = "ollama"' "$HOME/.vector/config.toml"
            ls -d /Applications/Ollama.app "$HOME/Applications/Ollama.app" 2>/dev/null | head -n 1 | grep -q Ollama
          fi
          "$HOME/.local/bin/vector" --selftest || true
      - name: Typing reaches the summon bar with the installed Python (Tk 9)
        if: matrix.ai == 'none'
        timeout-minutes: 3
        run: |
          out=$("$HOME/Library/Application Support/VECTOR/.venv/bin/python" tests/mac_typing_check.py)
          echo "$out"
          echo "$out" | grep -q "typed='hello'"
      - name: Summon bar has no title bar with the installed Tk (diagnostic)
        if: matrix.ai == 'none'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          for a in plain plain+mask document simple; do
            "$HOME/Library/Application Support/VECTOR/.venv/bin/python" tests/mac_style_probe.py $a || true
          done
      - name: Open VECTOR from Applications and quit it
        run: |
          open "$HOME/Applications/VECTOR.app"
          for i in $(seq 1 30); do pgrep -f "vector.app" >/dev/null && break; sleep 1; done
          sleep 8
          pgrep -fl "vector.app" || { echo "VECTOR didn't start"; cat "$HOME/.vector/app.log" || true; exit 1; }
          cat "$HOME/.vector/app.log" || true
          grep -q "crash" "$HOME/.vector/app.log" && exit 1
          "$HOME/Library/Application Support/VECTOR/.venv/bin/python" -c "from vector.instance import signal_running; print('told it to quit:', signal_running('quit'))"
          for i in $(seq 1 10); do pgrep -f "vector.app" >/dev/null || break; sleep 1; done
          if pgrep -f "vector.app" >/dev/null; then echo "VECTOR didn't quit"; exit 1; fi
      - name: Update over the top keeps settings
        env:
          VECTOR_INSTALL_KEEP_SETTINGS: "1"
          VECTOR_INSTALL_AI: claude
        run: |
          bash install.sh > second-run.log 2>&1
          cat second-run.log
          grep -q "Already installed: uv" second-run.log
          grep -q "Already installed: Python" second-run.log
          ! grep -q 'provider = "anthropic"' "$HOME/.vector/config.toml"
      - name: Uninstall
        run: |
          APP="$HOME/Library/Application Support/VECTOR"
          bash "$APP/src/scripts/uninstall-macos.sh"
          test ! -e "$APP"
          test ! -e "$HOME/Applications/VECTOR.app"
          test ! -e "$HOME/.local/bin/vector"
          test ! -e "$HOME/Library/LaunchAgents/com.vector.assistant.plist"
          test -f "$HOME/.vector/config.toml"   # user data is kept by default

  # Windows' own voice speaks "Vector. Open notepad." and VECTOR must understand it.
  speech-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[voice,dev]"
      - run: pytest -v tests/test_speech_e2e.py
        env:
          VECTOR_SPEECH_E2E: "1"
