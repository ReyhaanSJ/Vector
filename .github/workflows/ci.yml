name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          # macOS minutes cost 10x on private repos, so test just one version there.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: vector --selftest
        continue-on-error: true  # CI has no AI key, sound or screen; this just shows the report

  # Runs the real Windows installer end to end, then the uninstaller.
  windows-installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ai: [none, ollama]
    env:
      VECTOR_INSTALL_YES: "1"
      VECTOR_INSTALL_AI: ${{ matrix.ai }}
      VECTOR_INSTALL_SKIP_MODEL: "1"
      VECTOR_UNINSTALL_YES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Double-click equivalent of "Install VECTOR.bat"
        shell: cmd
        run: echo.| "Install VECTOR.bat"
      - name: VECTOR runs from the installed copy
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\VECTOR\.venv\Scripts\vector.exe"
          & $exe --version; if ($LASTEXITCODE) { exit 1 }
          & $exe --list-skills | Select-Object -First 4
          cmd /c "$env:LOCALAPPDATA\Microsoft\WindowsApps\vector.cmd" --version; if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\VECTOR.lnk")) { throw "no desktop shortcut" }
          Get-Content "$env:USERPROFILE\.vector\config.toml" | Select-String "^(provider|model) ="
          if ("${{ matrix.ai }}" -eq "ollama") {
            if (-not (Select-String -Path "$env:USERPROFILE\.vector\config.toml" -Pattern '^provider = "ollama"')) { throw "ollama not configured" }
          }
      - name: Uninstall
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\VECTOR\src\scripts\uninstall-windows.ps1"
          if (Test-Path "$env:LOCALAPPDATA\Programs\VECTOR") { throw "app folder still there" }
          if (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\vector.cmd") { throw "vector command still there" }
